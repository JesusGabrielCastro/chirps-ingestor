[project]
name = "chirps-ingestor"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "selenium>=4.18",
    "rasterio>=1.3",
    "fiona>=1.9",
    "shapely>=2.0",
    "GDAL>=3.6",
    "numpy>=1.26",
    "requests>=2.31",
    "pymongo>=4.6",
    "minio>=7.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
